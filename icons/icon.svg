<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2826"/>
      <stop offset="100%" stop-color="#171615"/>
    </linearGradient>
    <linearGradient id="topPlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4cfc7"/>
      <stop offset="50%" stop-color="#ebe6de"/>
      <stop offset="100%" stop-color="#bdb7ae"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#3c5a78"/>
      <stop offset="45%" stop-color="#16212e"/>
      <stop offset="85%" stop-color="#0b0f15"/>
      <stop offset="100%" stop-color="#1f2c3d"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#121110"/>
  <!-- Camera Body -->
  <rect x="64" y="132" width="384" height="264" rx="34" fill="url(#bodyGrad)" stroke="#3f3b37" stroke-width="4"/>
  <!-- Brushed Silver Top Plate -->
  <path d="M64 166 C64 147 79 132 98 132 L414 132 C433 132 448 147 448 166 L448 206 L64 206 Z" fill="url(#topPlate)"/>
  <!-- Grip Leather Texture Accent -->
  <rect x="78" y="218" width="96" height="160" rx="14" fill="#1e1c1a" stroke="#2d2a27" stroke-width="2"/>
  <!-- Shutter Button -->
  <circle cx="124" cy="122" r="20" fill="#e85d04"/>
  <circle cx="124" cy="122" r="12" fill="#ff7b29"/>
  <!-- Viewfinder Window -->
  <rect x="174" y="150" width="66" height="40" rx="8" fill="#16181c" stroke="#8a847c" stroke-width="3"/>
  <rect x="184" y="158" width="46" height="24" rx="4" fill="#2c3e50"/>
  <circle cx="220" cy="166" r="4" fill="#7ec8e3" opacity="0.7"/>
  <!-- Flash Window -->
  <rect x="352" y="148" width="68" height="42" rx="8" fill="#f3efe6" stroke="#8a847c" stroke-width="3"/>
  <line x1="364" y1="158" x2="408" y2="158" stroke="#c8c2b6" stroke-width="2"/>
  <line x1="364" y1="169" x2="408" y2="169" stroke="#c8c2b6" stroke-width="2"/>
  <line x1="364" y1="180" x2="408" y2="180" stroke="#c8c2b6" stroke-width="2"/>
  <!-- Red Tally / Self-Timer LED -->
  <circle cx="286" cy="170" r="9" fill="url(#amberGlow)"/>
  <!-- Lens Outer Barrel -->
  <circle cx="282" cy="284" r="98" fill="#11100f" stroke="#a8a298" stroke-width="8"/>
  <circle cx="282" cy="284" r="82" fill="#1c1b1a" stroke="#4f4a44" stroke-width="4"/>
  <circle cx="282" cy="284" r="66" fill="url(#lensGlass)" stroke="#2b2927" stroke-width="4"/>
  <!-- Aperture Blades Ring -->
  <circle cx="282" cy="284" r="38" fill="#090d12" stroke="#2c3e50" stroke-width="2"/>
  <!-- Lens Reflections -->
  <circle cx="258" cy="260" r="14" fill="#89c2d9" opacity="0.45"/>
  <circle cx="304" cy="306" r="7" fill="#ffb347" opacity="0.5"/>
  <!-- Retro Stripe -->
  <rect x="64" y="204" width="384" height="6" fill="#e85d04"/>
</svg>
